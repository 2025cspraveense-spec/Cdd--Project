# ==============================================================================
# Secret Leak Guard - Unified Nginx Edge Gateway & Reverse Proxy
# Aggregates all internal services into a single unified URL / host:
#   - http://localhost/        -> Universal Security Scanner Portal & React UI (Port 5050)
#   - http://localhost/api/v1/ -> Scanner REST API & Scan Orchestration (Port 5050)
#   - http://localhost/app/    -> Runtime Hardened Demo App & Secret Posture (Port 5000)
#   - http://localhost/vault/  -> HashiCorp Vault Secrets Engine (Port 8200)
#   - http://localhost/nginx-health -> Gateway Health & Routing Diagnostics
# ==============================================================================

upstream scanner_api {
    server scanner-api:5050;
    keepalive 32;
}

upstream runtime_app {
    server app:5000;
    keepalive 16;
}

upstream vault_service {
    server vault:8200;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name localhost _;

    # Standard DevSecOps Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Gateway "Secret-Leak-Guard-Nginx-Gateway/2.0" always;

    # Maximum payload size for ZIP uploads and repository ingests
    client_max_body_size 100M;

    # --------------------------------------------------------------------------
    # 1. Gateway Health & Unified Route Diagnostics
    # --------------------------------------------------------------------------
    location = /nginx-health {
        default_type application/json;
        return 200 '{"status":"healthy","service":"secret-leak-guard-gateway","version":"2.0.0","unified_url":"http://localhost/","routes":{"/":"Universal Security Scanner UI (React 18)","/api/v1/":"Scanner REST API & Execution Engine","/app/":"Runtime Hardened Web Application & Secret Telemetry","/vault/":"HashiCorp Vault UI and REST Engine"}}';
    }

    # --------------------------------------------------------------------------
    # 2. Scanner REST API & Report Endpoints
    # --------------------------------------------------------------------------
    location /api/ {
        proxy_pass http://scanner_api/api/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # Extended timeouts for long-running deep security scans
        proxy_connect_timeout 60s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
        proxy_buffering       off;
    }

    # --------------------------------------------------------------------------
    # 3. Runtime Hardened Demo Application & Secret Diagnostics (/app/)
    # --------------------------------------------------------------------------
    location = /app {
        return 301 /app/;
    }

    location /app/ {
        proxy_pass http://runtime_app/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /app;
        proxy_set_header Connection "";

        proxy_connect_timeout 30s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # --------------------------------------------------------------------------
    # 4. HashiCorp Vault Secrets Engine & Web Console (/vault/)
    # --------------------------------------------------------------------------
    location = /vault {
        return 301 /vault/;
    }

    location /vault/ {
        proxy_pass http://vault_service/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_redirect / /vault/;
        proxy_connect_timeout 30s;
        proxy_send_timeout    60s;
        proxy_read_timeout    120s;
    }

    # --------------------------------------------------------------------------
    # 5. Universal Security Scanner Dashboard (Root SPA & Static Assets)
    # --------------------------------------------------------------------------
    location / {
        proxy_pass http://scanner_api;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # WebSockets / SSE support if needed
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 60s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
    }

    # Custom 50x error page for gracefully reporting upstream outages
    error_page 502 503 504 /gateway_error.json;
    location = /gateway_error.json {
        default_type application/json;
        return 503 '{"error":"Upstream service temporarily unavailable","gateway":"Secret Leak Guard Nginx Edge","remediation":"Ensure upstream containers (scanner-api, app, vault) are running and healthy."}';
    }
}
