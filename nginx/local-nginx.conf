# ==============================================================================
# Secret Leak Guard - Local Host Nginx Configuration
# For running Nginx natively on developer workstation / host OS without Docker.
# Routes:
#   http://localhost:8080/        -> 127.0.0.1:5050 (Scanner UI & API)
#   http://localhost:8080/api/v1/ -> 127.0.0.1:5050 (Scanner API)
#   http://localhost:8080/app/    -> 127.0.0.1:5000 (Runtime Demo App)
#   http://localhost:8080/vault/  -> 127.0.0.1:8200 (Vault UI & API)
#   http://localhost:8080/nginx-health -> Gateway Health
# ==============================================================================

events {
    worker_connections 512;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout 65;
    client_max_body_size 100M;

    upstream local_scanner {
        server 127.0.0.1:5050;
    }

    upstream local_app {
        server 127.0.0.1:5000;
    }

    upstream local_vault {
        server 127.0.0.1:8200;
    }

    server {
        listen 8080;
        server_name localhost 127.0.0.1;

        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Gateway "Secret-Leak-Guard-Local-Gateway/2.0" always;

        location = /nginx-health {
            default_type application/json;
            return 200 '{"status":"healthy","mode":"local-host","unified_url":"http://localhost:8080/","routes":{"/":"Scanner UI & API (5050)","/app/":"Runtime App (5000)","/vault/":"Vault (8200)"}}';
        }

        location /api/ {
            proxy_pass http://local_scanner/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 300s;
        }

        location = /app {
            return 301 /app/;
        }

        location /app/ {
            proxy_pass http://local_app/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Prefix /app;
        }

        location = /vault {
            return 301 /vault/;
        }

        location /vault/ {
            proxy_pass http://local_vault/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_redirect / /vault/;
        }

        location / {
            proxy_pass http://local_scanner;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 300s;
        }
    }
}
