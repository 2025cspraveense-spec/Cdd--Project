name: Secret Leak Guard Enterprise CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  # ============================================================================
  # STAGE 0: Automated Test & Code Quality Pre-Flight
  # ============================================================================
  stage-0-test-and-lint:
    name: "Stage 0: Unit Tests & Pre-Flight"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt

      - name: Run Unit Tests
        run: python -m unittest discover tests -v

  # ============================================================================
  # STAGE 1: Full Repository, Git History & Filesystem Secret Scanning
  # ============================================================================
  stage-1-repo-and-fs-scan:
    name: "Stage 1: Gitleaks & Trivy Filesystem Scan"
    needs: [stage-0-test-and-lint]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code with Full Git History
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Deep scan all historical commits

      - name: Create Reports Directory
        run: mkdir -p reports

      - name: Install Gitleaks
        run: |
          GITLEAKS_VERSION="8.24.0"
          echo "Installing Gitleaks v${GITLEAKS_VERSION}..."
          wget -q "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -O gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz
          sudo mv gitleaks /usr/local/bin/
          gitleaks version

      - name: Run Gitleaks Secret Detection
        run: |
          echo "Scanning repository and commit history with custom entropy rules..."
          gitleaks detect \
            --config=.gitleaks.toml \
            --verbose \
            --redact \
            --report-format json \
            --report-path reports/gitleaks-report.json

      - name: Run Trivy Filesystem Scan (Secrets & Config Vulnerabilities)
        uses: aquasecurity/trivy-action@0.29.0
        with:
          scan-type: "fs"
          scanners: "secret,vuln"
          severity: "CRITICAL,HIGH"
          format: "json"
          output: "reports/trivy-fs-report.json"
          exit-code: "0" # Non-blocking for fs, logs into dashboard

      - name: Upload Gitleaks Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-scan-report
          path: reports/gitleaks-report.json
          retention-days: 14

  # ============================================================================
  # STAGE 2: Multi-Stage Container Build & Trivy Image Secret Scanning
  # ============================================================================
  stage-2-docker-build-and-scan:
    name: "Stage 2: Docker Build & Trivy Image Secret Scan"
    needs: [stage-0-test-and-lint]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create Reports Directory
        run: mkdir -p reports

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Hardened Container Image (Pinned Base)
        run: |
          echo "Building multi-stage container image for security inspection..."
          docker build -t secret-leak-guard:${{ github.sha }} -f Dockerfile .

      - name: Run Trivy Image Secret Scan
        uses: aquasecurity/trivy-action@0.29.0
        with:
          image-ref: "secret-leak-guard:${{ github.sha }}"
          scan-type: "image"
          scanners: "secret"
          severity: "CRITICAL,HIGH"
          format: "json"
          output: "reports/trivy-secret-report.json"
          exit-code: "1" # Fails CI if credentials are baked into layers or ENV metadata

      - name: Upload Trivy Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-scan-report
          path: reports/trivy-secret-report.json
          retention-days: 14

  # ============================================================================
  # STAGE 3: Alert Dispatch, HTML Dashboard with Charts & Audit Artifacts
  # ============================================================================
  stage-3-alert-and-report-synthesis:
    name: "Stage 3: Alert & Report Synthesis"
    needs: [stage-1-repo-and-fs-scan, stage-2-docker-build-and-scan]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create Reports Directory
        run: mkdir -p reports

      - name: Download Gitleaks Artifact
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: gitleaks-scan-report
          path: reports

      - name: Download Trivy Artifact
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: trivy-scan-report
          path: reports

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate HTML Scan Dashboard with Charts
        run: |
          python scripts/generate_dashboard.py \
            --gitleaks-report reports/gitleaks-report.json \
            --trivy-report reports/trivy-secret-report.json \
            --output reports/dashboard.html

      - name: Upload Combined Scan Dashboard & Reports
        uses: actions/upload-artifact@v4
        with:
          name: secret-leak-guard-dashboard
          path: reports/dashboard.html
          retention-days: 30

      - name: Dispatch Security Alert to Webhook (On Failure Only)
        if: needs.stage-1-repo-and-fs-scan.result == 'failure' || needs.stage-2-docker-build-and-scan.result == 'failure'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_COMMIT: ${{ github.sha }}
          GITHUB_AUTHOR: ${{ github.actor }}
          GITHUB_BRANCH: ${{ github.ref_name }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          chmod +x scripts/alert.sh
          ./scripts/alert.sh \
            --repo "${GITHUB_REPO}" \
            --commit "${GITHUB_COMMIT}" \
            --author "${GITHUB_AUTHOR}" \
            --branch "${GITHUB_BRANCH}" \
            --run-id "${GITHUB_RUN_ID}" \
            --gitleaks reports/gitleaks-report.json \
            --trivy reports/trivy-secret-report.json
