services:
  # ============================================================================
  # Nginx Reverse Proxy Edge Gateway (Unified Entry Point on Port 80 & 8080)
  # Aggregates:
  #   - Scanner Portal & React UI : http://localhost/
  #   - Scanner REST API          : http://localhost/api/v1/
  #   - Runtime Secured Demo App  : http://localhost/app/
  #   - HashiCorp Vault           : http://localhost/vault/
  #   - Gateway Health Diagnostics: http://localhost/nginx-health
  # ============================================================================
  gateway:
    build:
      context: .
      dockerfile: Dockerfile.nginx
    image: secret-leak-guard-gateway:2.0.0
    container_name: slg-gateway
    ports:
      - "80:80"
      - "8080:80"
    depends_on:
      - scanner-api
      - app
      - vault
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/nginx-health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - slg-network
    restart: unless-stopped

  # ============================================================================
  # MongoDB Database Service (Pinned Version: 7.0)
  # ============================================================================
  mongo:
    image: mongo:7.0
    container_name: slg-mongo
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: secret_leak_guard
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.runCommand({ping: 1})"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - slg-network
    restart: unless-stopped

  # ============================================================================
  # HashiCorp Vault Service (Pinned Version: 1.15.6)
  # ============================================================================
  vault:
    image: hashicorp/vault:1.15.6
    container_name: slg-vault
    ports:
      - "8200:8200"
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: "root"
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
    cap_add:
      - IPC_LOCK
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 5s
      timeout: 3s
      retries: 3
    networks:
      - slg-network

  # ============================================================================
  # Universal Security Scanner Service (Port 5050)
  # ============================================================================
  scanner-api:
    build:
      context: .
      dockerfile: Dockerfile.scanner
    image: secret-leak-guard-scanner:2.0.0
    container_name: slg-scanner-api
    ports:
      - "5050:5050"
    depends_on:
      mongo:
        condition: service_healthy
      vault:
        condition: service_healthy
    environment:
      - SCANNER_PORT=5050
      - MONGO_URI=mongodb://mongo:27017/secret_leak_guard
      - VAULT_ADDR=http://vault:8200
      - VAULT_TOKEN=root
    networks:
      - slg-network
    restart: unless-stopped

  # ============================================================================
  # Application Demo Service (Preserved)
  # ============================================================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: secret-leak-guard:1.0.0
    container_name: slg-app
    ports:
      - "5000:5000"
    depends_on:
      vault:
        condition: service_healthy
    environment:
      - PORT=5000
      - VAULT_ADDR=http://vault:8200
      - VAULT_TOKEN=root
      - VAULT_SECRET_PATH=payment-service
      - VAULT_MOUNT_POINT=secret
    networks:
      - slg-network
    restart: unless-stopped

volumes:
  mongo-data:

networks:
  slg-network:
    driver: bridge
