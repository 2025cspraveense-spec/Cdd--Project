version: "3.8"

services:
  vault:
    image: hashicorp/vault:1.15.6
    container_name: slg-vault
    ports:
      - "8200:8200"
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: "root"
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
    cap_add:
      - IPC_LOCK
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 5s
      timeout: 3s
      retries: 3
    networks:
      - slg-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: secret-leak-guard:1.0.0
    container_name: slg-app
    ports:
      - "5000:5000"
    depends_on:
      vault:
        condition: service_healthy
    environment:
      - PORT=5000
      - VAULT_ADDR=http://vault:8200
      - VAULT_TOKEN=root
      - VAULT_SECRET_PATH=payment-service
      - VAULT_MOUNT_POINT=secret
    networks:
      - slg-network
    restart: unless-stopped

networks:
  slg-network:
    driver: bridge
