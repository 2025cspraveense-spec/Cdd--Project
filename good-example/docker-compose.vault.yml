version: "3.8"

services:
  vault:
    image: hashicorp/vault:1.15
    container_name: slg-vault
    ports:
      - "8200:8200"
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: "root"
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
      VAULT_ADDR: "http://127.0.0.1:8200"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8200/v1/sys/health || vault status -address=http://127.0.0.1:8200 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  app:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: slg-app
    ports:
      - "5000:5000"
    depends_on:
      vault:
        condition: service_healthy
    environment:
      - PORT=5000
      - VAULT_ADDR=http://vault:8200
      - VAULT_TOKEN=root
      - VAULT_SECRET_PATH=payment-service
      - VAULT_MOUNT_POINT=secret
